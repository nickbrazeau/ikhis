	<meta name="description" content="Open-access immunosequencing data | Walters, Kathie-Anne | Nasomucosal and systemic viral shedding-correlated responses fol | Adaptive Biotechnologies | Each year in the U.S., approximately 50% of adults ≥18 years are vaccinated against influenza viruses, with protective efficacy averaging 40.5% over the last 20 years. To model annual seasonal influenza, a cohort of 74 adults, who were unscreened for pre-existing A/H1N1 immunity and half of whom were recently immunized with licensed QIV (mean 64 days), were challenged with A/H1N1 virus.  Transcriptomic, proteomic, and VDJ repertoire analyses were performed on nasal and peripheral samples from participants to identify shedding-correlated nasomucosal responses and immune correlates of protection. Viral shedding participants showed increased T-cell, but not B-cell, VDJ diversity with expansion of low frequency B-cell clones post-challenge, including broadly neutralizing motifs. Non-shedding participants demonstrated decreased clonality and increased richness of both B- and T-cell VDJ clones, increased pre-inoculation nasomucosal immune gene and serum protein expression, and increased ex vivo PBMC responses. Nasomucosal responses in participants shedding virus for &amp;amp;amp;gt;2 days showed higher early viral loads and correlated with strongest induction of antiviral responses compared to participants who shed virus for one day. Finally, participants with a single day of viral shedding were three-times more likely to be female. Understanding the complex immune responses in both the nasomucosa and the periphery following influenza vaccination and infection will be critical to next-generation vaccine development." />
